<div class="conv-list" role="list">
  @for (conv of conversations(); track conv.id) {
    <button
      type="button"
      class="conv-item"
      [class.active]="conv.id === activeId()"
      [class.unread]="conv.unreadCount > 0"
      (click)="select.emit(conv.id)"
      role="listitem">

      <div class="conv-item__avatar" [class.group]="kind(conv) !== 'direct'">
        @if (avatarUrl(conv)) {
          <img [src]="avatarUrl(conv)" [alt]="displayName(conv)" class="conv-item__avatar-img" />
        } @else if (kind(conv) === 'direct') {
          <span class="conv-item__avatar-initials">{{ displayName(conv) | initials:2 }}</span>
        } @else {
          <mat-icon>{{ avatarIcon(conv) }}</mat-icon>
        }

        @if (kind(conv) === 'direct') {
          <span
            class="conv-item__status-dot"
            [class.online]="isOnline(conv)"
            [class.offline]="!isOnline(conv)">
          </span>
        }
      </div>

      <div class="conv-item__info">
        <div class="conv-item__top">
          <span class="conv-item__name">{{ displayName(conv) }}</span>
          @if (conv.lastMessage) {
            <span class="conv-item__time">{{ formatTime(conv.lastMessage.createdAt) }}</span>
          }
        </div>
        <div class="conv-item__bottom">
          <span class="conv-item__preview">
            @if (kind(conv) !== 'direct') {
              <mat-icon class="conv-item__type-icon">{{ avatarIcon(conv) }}</mat-icon>
            }
            @if (conv.lastMessage) {
              {{ conv.lastMessage.content }}
            } @else {
              {{ kind(conv) !== 'direct' ? participantsSummary(conv) : 'Sin mensajes aún' }}
            }
          </span>
          @if (conv.unreadCount > 0) {
            <span class="conv-item__badge">{{ conv.unreadCount }}</span>
          }
        </div>
      </div>
    </button>
  } @empty {
    <div class="conv-empty">
      <mat-icon>forum</mat-icon>
      <p>No hay conversaciones</p>
    </div>
  }
</div>
