<div
  class="avatar-upload"
  [class.avatar-upload--rounded]="shape() === 'rounded'"
  [style.--avatar-size.px]="size()"
>
  <div class="avatar-upload__wrapper">
    <div class="avatar-upload__circle">
      @if (uploading()) {
        <div class="avatar-upload__overlay">
          <mat-spinner diameter="36" color="primary" />
        </div>
      }

      @if (resolvedAvatarUrl() && !imgLoadError()) {
        <img
          [src]="resolvedAvatarUrl()"
          [alt]="label()"
          class="avatar-upload__img"
          (error)="onImgError()"
          (load)="onImgLoad()"
        />
      } @else {
        <div class="avatar-upload__placeholder">
          @if (mode() === 'company' && !companyName()) {
            <mat-icon class="placeholder-icon">{{ fallbackIcon() }}</mat-icon>
          } @else {
            <span>{{ initials }}</span>
          }
        </div>
      }
    </div>

    <label
      class="avatar-upload__badge"
      [title]="mode() === 'company' ? 'Cambiar logo de la empresa' : 'Cambiar foto de perfil'"
    >
      <mat-icon>{{ mode() === 'company' ? 'add_photo_alternate' : 'photo_camera' }}</mat-icon>
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp"
        class="avatar-upload__input"
        (change)="onFileSelected($event)"
      />
    </label>
  </div>

  <div class="avatar-upload__controls">
    <label class="avatar-upload__btn-select">
      <button
        mat-stroked-button
        type="button"
        [disabled]="uploading()"
        (click)="fileInput.click()"
      >
        <mat-icon>{{ resolvedAvatarUrl() ? 'sync' : 'upload' }}</mat-icon>
        {{ resolvedAvatarUrl() ? (mode() === 'company' ? 'Cambiar Logo' : 'Cambiar Foto') : (mode() === 'company' ? 'Subir Logo' : 'Subir Foto') }}
      </button>
      <input
        #fileInput
        type="file"
        accept="image/jpeg,image/png,image/webp"
        class="avatar-upload__input"
        (change)="onFileSelected($event)"
      />
    </label>

    @if (resolvedAvatarUrl()) {
      <button
        mat-button
        color="warn"
        type="button"
        [disabled]="uploading()"
        (click)="removeAvatar()"
      >
        <mat-icon>delete</mat-icon> Eliminar
      </button>
    }
  </div>

  @if (errorMsg()) {
    <p class="avatar-upload__error">{{ errorMsg() }}</p>
  }
</div>
